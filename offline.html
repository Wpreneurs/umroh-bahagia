<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <title>Anda Sedang Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
    }
    .box {
      padding: 30px;
      max-width: 320px;
    }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Anda Sedang Offline</h2>
    <p>Periksa koneksi internet Anda,
       kemudian coba kembali.</p>
    <button onclick="location.reload()">
      Coba Lagi
    </button>
  </div>
</body>
</html>
